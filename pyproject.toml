[build-system]
requires = [
    "hatchling",
    "jupyterlab==4.*",
    "jupyter-builder>=1.0.2",
]
build-backend = "hatchling.build"

[project]
name = "jupyter-islide"
version = "0.6.18"
description = "Interactive whole-slide pathology image viewer for Jupyter, backed by OpenSlide"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rvalieris" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "ipywidgets>=8",
    "openslide-python>=1.4",
    "pillow>=9",
]

[project.urls]
Homepage = "https://github.com/rvalieris/jupyter-islide"
Repository = "https://github.com/rvalieris/jupyter-islide"
Issues = "https://github.com/rvalieris/jupyter-islide/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["islide"]

# Install the pre-built JupyterLab extension into JupyterLab's standard
# labextensions discovery path.
[tool.hatch.build.targets.wheel.shared-data]
"frontend/labextension" = "share/jupyter/labextensions/jupyter-islide"

# Build the frontend/ labextension into frontend/labextension/ at wheel build time.
[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.8.6"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["frontend/labextension/package.json"]
# Let `pip install -e .` succeed even when node/npm are unavailable.
optional-editable-build = "true"

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
path = "frontend"
build_cmd = "build"
npm = ["npm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
