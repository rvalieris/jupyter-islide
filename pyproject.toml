[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "islide"
version = "0.0.2"
description = "Interactive whole-slide pathology image viewer for Jupyter, backed by OpenSlide"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8",
    "openslide-python>=1.4",
    "pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["islide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
